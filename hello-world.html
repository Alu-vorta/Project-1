<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello, World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07060b;
      --ink: #f4efe6;
      --muted: #8a8496;
      --a: #ff6b4a;
      --b: #ffb84a;
      --c: #7a5cff;
      --d: #2fd6c3;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Fraunces', Georgia, serif;
      overflow: hidden;
      display: grid;
      place-items: center;
      cursor: default;
    }

    /* Drifting aurora blobs */
    .aurora {
      position: fixed;
      inset: -20%;
      filter: blur(90px) saturate(140%);
      opacity: 0.55;
      z-index: 0;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      mix-blend-mode: screen;
      animation: drift 18s ease-in-out infinite alternate;
    }
    .blob:nth-child(1) { width: 45vw; height: 45vw; background: var(--a); top: 15%; left: 10%; }
    .blob:nth-child(2) { width: 40vw; height: 40vw; background: var(--c); top: 40%; left: 50%; animation-duration: 22s; animation-delay: -6s; }
    .blob:nth-child(3) { width: 30vw; height: 30vw; background: var(--d); top: 5%;  left: 55%; animation-duration: 26s; animation-delay: -12s; }
    .blob:nth-child(4) { width: 28vw; height: 28vw; background: var(--b); top: 55%; left: 15%; animation-duration: 20s; animation-delay: -3s; }

    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(8vw, -6vh) scale(1.15); }
      100% { transform: translate(-6vw, 8vh) scale(0.9); }
    }

    /* Film grain */
    .grain {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.08;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    /* Cursor glow */
    .glow {
      position: fixed;
      width: 420px; height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.12), transparent 60%);
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 2;
      transition: opacity 0.4s;
    }

    main {
      position: relative;
      z-index: 3;
      text-align: center;
      padding: 16px;
    }

    .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(0.7rem, 1.4vw, 0.85rem);
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      animation: fadeUp 1s 0.2s forwards;
    }
    .eyebrow span { color: var(--d); }

    h1 {
      font-size: clamp(3.5rem, 15vw, 12rem);
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.04em;
      margin: 0.25em 0 0.15em;
      font-variation-settings: "opsz" 144;
    }
    h1 .line { display: block; }
    h1 .char {
      display: inline-block;
      opacity: 0;
      transform: translateY(0.6em) rotate(8deg);
      animation: rise 0.9s cubic-bezier(.2,.9,.25,1.2) forwards;
      transition: transform 0.3s, color 0.3s;
    }
    h1 .char:hover {
      transform: translateY(-0.08em) rotate(-4deg) !important;
      color: var(--b);
    }
    h1 em {
      font-style: italic;
      font-weight: 400;
      background: linear-gradient(100deg, var(--a), var(--b) 30%, var(--d) 60%, var(--c));
      background-size: 250% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 6s linear infinite;
      padding-right: 0.08em;
    }
    h1 em .char { color: inherit; }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0) rotate(0); }
    }
    @keyframes shimmer {
      0%   { background-position: 0% 50%; }
      100% { background-position: 250% 50%; }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .terminal {
      display: inline-flex;
      align-items: center;
      gap: 0.6em;
      margin-top: 1.5rem;
      padding: 0.8em 1.4em;
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(0.8rem, 1.8vw, 1rem);
      color: var(--ink);
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0;
      animation: fadeUp 1s 1.6s forwards;
    }
    .terminal .prompt { color: var(--a); }
    .cursor {
      display: inline-block;
      width: 0.55em; height: 1.1em;
      background: var(--d);
      vertical-align: middle;
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    footer {
      position: fixed;
      bottom: 24px;
      left: 0; right: 0;
      text-align: center;
      z-index: 3;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      color: var(--muted);
      opacity: 0;
      animation: fadeUp 1s 2.2s forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <div class="aurora">
    <div class="blob"></div><div class="blob"></div><div class="blob"></div><div class="blob"></div>
  </div>
  <div class="grain"></div>
  <div class="glow" id="glow"></div>

  <main>
    <p class="eyebrow">// first transmission <span>●</span> live</p>
    <h1>
      <span class="line" data-split>Hello,</span>
      <span class="line"><em data-split>World</em></span>
    </h1>
    <div class="terminal">
      <span class="prompt">❯</span>
      <span id="typed"></span><span class="cursor"></span>
    </div>
  </main>

  <footer>MADE WITH HTML · CSS · A LITTLE MAGIC</footer>

  <script>
    // Split headline into animated characters
    let delay = 0.35;
    document.querySelectorAll('[data-split]').forEach(el => {
      const text = el.textContent;
      el.textContent = '';
      [...text].forEach(ch => {
        const s = document.createElement('span');
        s.className = 'char';
        s.textContent = ch === ' ' ? ' ' : ch;
        s.style.animationDelay = delay.toFixed(2) + 's';
        delay += 0.07;
        el.appendChild(s);
      });
    });

    // Typewriter cycling through greetings
    const phrases = [
      'print("Hello, World!")',
      'console.log("Hello, World!");',
      'std::cout << "Hello, World!";',
      '<h1>Hello, World!</h1>',
      'echo "Hello, World!"'
    ];
    const typed = document.getElementById('typed');
    let p = 0, i = 0, deleting = false;
    function tick() {
      const word = phrases[p];
      typed.textContent = word.slice(0, i);
      if (!deleting && i < word.length) { i++; setTimeout(tick, 55); }
      else if (!deleting) { deleting = true; setTimeout(tick, 1600); }
      else if (i > 0) { i--; setTimeout(tick, 25); }
      else { deleting = false; p = (p + 1) % phrases.length; setTimeout(tick, 300); }
    }
    setTimeout(tick, 2000);

    // Cursor-following glow
    const glow = document.getElementById('glow');
    window.addEventListener('pointermove', e => {
      glow.style.left = e.clientX + 'px';
      glow.style.top = e.clientY + 'px';
    });
  </script>
</body>
</html>
